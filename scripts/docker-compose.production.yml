name: ${COMPOSE_PROJECT_NAME:-daoyou}

x-app-common: &app-common
  image: ${APP_IMAGE:?APP_IMAGE must be an immutable tag such as registry/daoyou-app:<git-sha>}
  restart: unless-stopped
  env_file:
    - ${ENV_FILE:-/root/daoyou/.env.production}
  environment:
    PORT: 3000
    APP_ENV: production
    NODE_ENV: production
    APP_RELEASE: ${APP_RELEASE:-unknown}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - runtime
  healthcheck:
    test:
      [
        "CMD",
        "bun",
        "-e",
        "fetch('http://127.0.0.1:3000/api/ready-check').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))",
      ]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 10s
  stop_grace_period: 90s
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  app-blue:
    <<: *app-common
    container_name: ${BLUE_CONTAINER:-daoyou-app-blue}
    ports:
      - "127.0.0.1:${BLUE_PORT:-3000}:3000"
    profiles: [blue]

  app-green:
    <<: *app-common
    container_name: ${GREEN_CONTAINER:-daoyou-app-green}
    ports:
      - "127.0.0.1:${GREEN_PORT:-3001}:3000"
    profiles: [green]

networks:
  runtime:
    name: ${APP_NETWORK:-daoyou-runtime}
    external: true
